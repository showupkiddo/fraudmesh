version: "3.9"

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.18.0
    container_name: fraudmesh-mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --default-artifact-root /mlruns/artifacts
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    restart: unless-stopped
