[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudmesh"
version = "0.1.0"
description = "FraudMesh federated AML detection scaffolding and research project."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "hydra-core==1.3.2",
  "mlflow==2.18.0",
  "pandas==2.2.3",
  "pandera==0.22.1",
  "pyarrow==18.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "ruff==0.6.9",
  "mypy==1.11.2",
  "pre-commit==4.0.1",
]
data = [
  "dvc==3.67.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pandas.*", "pandera.*", "pyarrow.*"]
ignore_missing_imports = true
