name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,data]
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src tests
      - name: Tests
        run: pytest -q
      - name: Reproduce canonical fixture with DVC
        run: python -m dvc repro phase1-fixture-canonical
